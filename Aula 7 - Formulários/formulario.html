<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <table border="0" cols="10" rows="">
        <tr>
            <td style="padding-right: 50px;"> 
                <form action="" method="post">
                    <label for="nome"><strong>Full Name</strong></label>
                    <br>
                    <input type="text" id="nome" name="nome" size="50">
                    <br><br>
                    <label for="telefone"><strong>Phone Number</strong></label>
                    <br>
                    <input type="text" id="telefone" name="telefone" size="50">
                </form>
            </td>
            <td style="padding-right: 50px;"> 
                <form action="" method="post">
                    <label for="date"><strong>Date of birth</strong></label>
                    <br>
                    <input type="date" id="date" name="date" style="width: 365px;">
                    <br><br>
                    <label for="email"><strong>Email</strong></label>
                    <br>
                    <input type="email" id="email" name="email" size="50">
                </form>
            </td>
        </tr>
    </table>
    <form action="" method="post">
        <label for="Adress"><strong>Current Adress</strong></label>
        <br>
        <input type="text" id="Adress" name="Adress" size="114">
    </form>
    <table>
        <tr>
            <td style="padding-right: 50px;">
                <h4>Position Applied For</h4>
                <form action="" method="post">
                    <input type="radio" id="position1" name="position" value="position1">
                    <label for="position1">Residential Cleaner</label><br>
                    <input type="radio" id="position2" name="position" value="position2">
                    <label for="position2">Commercial Cleaner</label><br>
                    <input type="radio" id="position3" name="position" value="position3">
                    <label for="position3">Supervisor</label><br>
                    <input type="radio" id="position4" name="position" value="position4">
                    <label for="position4">Other </label>
                    <input type="text" id="otherPosition" name="otherPosition" size="40">
                </form>
            </td>
            <td style="padding-right: 50px;">
                <h4>Specialized Cleaning Skills</h4>
                <form action="" method="post">
                    <input type="radio" id="skill1" name="skill" value="skill1">
                    <label for="skill1">Carpet Cleaning</label><br>
                    <input type="radio" id="skill2" name="skill" value="skill2">
                    <label for="skill2">Hazardous Material Handling</label><br>
                    <input type="radio" id="skill3" name="skill" value="skill3">
                    <label for="skill3">Floor Care/Polishing</label><br>
                    <input type="radio" id="skill4" name="skill" value="skill4">
                    <label for="skill4">Other </label>
                    <input type="text" id="otherSkill" name="otherSkill" size="41">
                </form>
            </td>
        </tr>
    </table>
    <table>
        <tr>
            <td style="padding-right: 50px;">
                <h4>Provide the link to your most recent online resume:</h4>
                <form action="" method="post">
                    <textarea id="resumeLink" name="resumeLink" cols="50" rows="6"></textarea>
                </form>
            </td>
            <td style="padding-right: 50px;">
                <h4>Preferred Work Type:</h4>
                <form action="" method="post">
                    <input type="radio" id="workType1" name="workType" value="workType1">
                    <label for="workType1">Full-time</label><br>
                    <input type="radio" id="workType2" name="workType" value="workType2">
                    <label for="workType2">Part-time</label><br>
                    <input type="radio" id="workType3" name="workType" value="workType3">
                    <label for="workType3">Temporary/Seasonal</label><br>
                    <input type="radio" id="workType4" name="workType" value="workType4">
                    <label for="workType4">Other </label>
                    <input type="text" id="otherWorkType" name="otherWorkType" size="41">
                </form>
            </td>
        </tr>
    </table>
    <p>I certify that all information provided in this application is true and complete.</p>
    <table>
        <tr>
            <td style="padding-right: 70px;">
                <form action="" method="post">
                    <label for="signature"><strong>Signature</strong></label>
                    <br>
                    <input type="text" id="signature" name="signature" size="51">
                </form>
            </td>
            <td style="padding-right: 50px;">
                <form action="" method="post">
                    <label for="date2"><strong>Date</strong></label>
                    <br>
                    <input type="date" id="date2" name="date2" style="width: 360px;">
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
